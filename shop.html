<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>山海茶事 · 店报样板</title>
  <meta name="description" content="商海时报·店报：小商家的可翻页品牌故事报。样板《山海茶事》：一家武夷山制茶人家的四十年。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&family=UnifrakturMaguntia&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <script>if (new URLSearchParams(location.search).get("draft")) document.write('<div class="draftbar">正在预览「店报工坊」里的草稿（只存在这台设备的浏览器里） <a href="studio.html">‹ 回到工坊继续改</a></div>');</script>
  <!-- ============ 头版 ============ -->
  <div id="front">
    <header class="masthead">
      <div class="ear"><span id="mhKicker">商海时报 · 店报</span><br /><b id="mhPeriod">1984 — 2026</b><br /><a class="link edition-link" href="index.html">‹ 返回主报</a> · <a class="link edition-link" href="studio.html">做一份我的店报 ›</a></div>
      <div class="title">
        <h1 id="mhTitle">山海茶事</h1>
        <div class="en" id="mhEn">Shanhai Tea Chronicle</div>
      </div>
      <div class="ear right"><span id="mhPrice">定价：一泡肉桂</span><br /><button id="quizBtn" class="link">看图猜年份 ›</button></div>
    </header>
    <div class="dateline">
      <span id="today"></span>
      <span class="sep">◆</span>
      <b id="edition" class="edition"></b>
      <span class="sep">◆</span>
      <span>今日 <b id="pageCount"></b> 版 · 故事 <b id="storyCount"></b> 则</span>
      <div class="search">
        <input id="q" type="search" placeholder="检索本报：年份、地点、人物、茶…" autocomplete="off" />
        <ul id="results" hidden></ul>
      </div>
    </div>

    <section id="machine" class="machine" tabindex="0" aria-label="时光机：本店的故事">
      <div class="m-left">
        <span class="kicker">店史 · 时光机</span>
        <div class="m-year" id="mYear">1984</div>
        <div class="m-era" id="mEra"></div>
        <p class="m-desc" id="mDesc"></p>
        <div class="m-ctrl">
          <button id="mPlay" class="go">▶ 播放店史</button>
          <button id="mSpeed" class="chip" title="播放速度">1×</button>
        </div>
        <p class="muted small">拖动下方标尺穿越 · 悬停圆点预览 · 点击展阅 · ← → 逐条跳转</p>
      </div>
      <div class="m-desk" id="mDesk">
        <div class="m-empty" id="mEmpty">故事即将开始……</div>
        <div class="m-stamp" id="mStamp"></div>
      </div>
      <div class="m-axis" id="mAxis">
        <div class="m-eras" id="mEras"></div>
        <div class="m-lanes" id="mLanes"></div>
        <div class="m-ticks" id="mTicks"></div>
        <div class="m-headwrap"><div class="m-head" id="mHead"></div></div>
      </div>
    </section>

    <section id="tree" class="tree" aria-label="家谱"></section>

    <main class="front-grid">
      <article id="lead" class="lead"></article>
      <aside id="brief" class="brief"></aside>
      <section id="stories" class="stories"></section>
    </main>

    <section class="river">
      <h3>时间之河 <small>这家店的影像，随岁月流动 · 悬停暂停，点击展阅</small></h3>
      <div class="river-window"><div id="river" class="river-track"></div></div>
    </section>

    <section id="shopcard" class="shopcard"></section>

    <footer class="colophon" id="colophon">
      店报样板 · 用 studio.html 填五个问题，就能生成你自己的店报。
    </footer>
  </div>

  <!-- ============ 翻页阅读 ============ -->
  <div id="reader" hidden>
    <div class="r-top">
      <button id="home" class="link">‹ 返回头版</button>
      <span id="rTitle"></span>
      <span id="rEra" class="muted"></span>
      <span id="rPage" class="muted"></span>
    </div>
    <div class="stage">
      <button id="prev" class="turn" aria-label="上一页">‹</button>
      <div id="book" class="book">
        <div id="pL" class="page left"></div>
        <div id="pR" class="page right"></div>
      </div>
      <button id="next" class="turn" aria-label="下一页">›</button>
    </div>
    <div class="r-bar">
      <button id="play">▶ 自动翻页</button>
      <button id="tone">旧报色调</button>
      <span class="muted small">← → 翻页 · 空格自动 · Esc 返回头版</span>
    </div>
    <div class="film">
      <div id="ruler" class="ruler"></div>
      <div class="film-window"><div id="film" class="film-track"></div></div>
    </div>
  </div>

  <!-- ============ 剪报 / 小试 弹窗 ============ -->
  <div id="modal" hidden>
    <div class="clip">
      <button class="close" id="mClose" aria-label="关闭">×</button>
      <div id="mBody"></div>
    </div>
  </div>

  <script>
    /* 数据来源：?draft=1 读「店报工坊」存在浏览器里的草稿；否则按 ?d=<名字> 加载 js/family-<名字>.js（默认 tea） */
    (function () {
      const q = new URLSearchParams(location.search);
      if (q.get("draft")) {
        try {
          const d = JSON.parse(localStorage.getItem("cc_draft") || "null");
          if (d && d.STORIES) { ["SITE", "ERAS", "EVENTS", "STORIES", "IMAGES", "FAMILY", "CAPTIONS"].forEach((k) => { if (d[k]) window[k] = d[k]; }); window.DRAFT = true; }
        } catch (e) {}
      }
      if (!window.STORIES) {
        const d = /^[a-z0-9-]{1,40}$/.test(q.get("d") || "") ? q.get("d") : "tea";
        document.write(`<script src="js/family-${d}.js"><\/script><script src="js/family-${d}-images.js"><\/script>`);
      }
    })();
  </script>
  <script src="js/app.js"></script>
  <script src="js/tree.js"></script>
</body>
</html>
